name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  create-release-pr:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog and bump version
        run: |
          npm exec standard-version -- \
            --release-as "${{ inputs.release }}" \
            --skip.tag \
            --verbose

      - name: Get new version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        run: |
          git switch -c "release/v${{ steps.version.outputs.version }}"

      - name: Push release branch
        run: |
          git push origin "release/v${{ steps.version.outputs.version }}"

      - name: Create release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${{ steps.version.outputs.version }}" \
            --title "chore(release): v${{ steps.version.outputs.version }}" \
            --body "$(cat <<'EOF'
          ## Release

          This PR was automatically generated by the release workflow.

          Release type: **${{ inputs.release }}**
          Version: **v${{ steps.version.outputs.version }}**

          The release should only be merged after all required CI checks pass.
          EOF
          )"
