name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm ci

      - name: Generate changelog and bump version
        run: |
          npm exec standard-version -- \
            --release-as "${{ inputs.release }}" \
            --skip.tag \
            --verbose

      - name: Get new version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        id: create-release-branch
        run: |
          BRANCH="release/v${{ steps.version.outputs.version }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Remote branch $BRANCH already exists. Close or clean up the existing release PR before retrying."
            exit 1
          fi

          git switch -c "$BRANCH"
          echo "release_branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        env:
          RELEASE_BRANCH: ${{ steps.create-release-branch.outputs.release_branch }}
        run: |
          git push origin "$RELEASE_BRANCH"

      - name: Create release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.create-release-branch.outputs.release_branch }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release }}
        run: |
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "$(cat <<EOF
          ## Release

          This PR was automatically generated by the release workflow.

          Release type: **$RELEASE_TYPE**
          Version: **v$VERSION**

          The release should only be merged after all required CI checks pass.
          EOF
          )"
