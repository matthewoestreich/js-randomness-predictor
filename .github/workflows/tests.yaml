name: Tests

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Midnight CST
    - cron: "0 0 * * *"
      timezone: "America/Chicago"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Bun tests
        run: bun run test:bun

  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install dependencies
        run: deno install
      - name: Build
        shell: bash
        run: deno task build
      - name: Run tests
        shell: bash
        run: deno task test:deno
        env:
          FORCE_COLOR: "1"

  generate-random-numbers-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [17.x, 18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x, node]
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Generate random numbers
        run: |
          node -e "
            const fs = require('fs');
            const sequence = Array.from({ length: 5 }, Math.random);
            const expected = Array.from({ length: 10 }, Math.random);
            const rands = { version: process.version, sequence, expected };
            const randsJson = JSON.stringify(rands);
            fs.writeFileSync('random-numbers.json', randsJson);
          "
      - name: Upload generated random numbers
        uses: actions/upload-artifact@v7
        with:
          name: random-numbers-${{ matrix.node-version }}
          path: random-numbers.json

  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts
      - name: Build code
        run: npm run build:ci
      - name: Upload built dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-dist
          path: dist/

  test-node:
    needs: [build-node, generate-random-numbers-node]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [10.x, 11.x, 12.x, 13.x, 14.x, 15.x, 16.x, 17.x, 18.x, 19.x, 20.x, 21.x, 22.x, 23.x, 24.x, 25.x, node]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Download generated random numbers
        uses: actions/download-artifact@v8
        with:
          name: random-numbers-${{ matrix.node-version }}
          path: random-numbers/
      #- name: Install Test Harness Dependencies Only
      #  run: npm install --ignore-scripts && npm i -D esbuild tsx
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Run tests
        run: npm run test:node:ci # tsx --test tests/node/*.test.ts
        env:
          FORCE_COLOR: 1
          RANDOM_NUMBERS_FILE_PATH: ./random-numbers/random-numbers.json
