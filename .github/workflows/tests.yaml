name: Tests

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Midnight CST
    - cron: "0 0 * * *"
      timezone: America/Chicago
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # This job only runs if workflow is called via schedule
  show-time:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Show Time
        shell: bash
        run: |
          printf '%-13s %s\n' 'RUNNER LOCAL:' "$(date '+%A, %m-%d-%Y %I:%M:%S %p %Z')"
          printf '%-13s %s\n' 'UTC:' "$(date -u '+%A, %m-%d-%Y %I:%M:%S %p %Z')"
          printf '%-13s %s\n' 'CST/CDT:' "$(TZ='America/Chicago' date '+%A, %m-%d-%Y %I:%M:%S %p %Z')"

  test-bun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Bun tests
        run: bun run test:bun

  test-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install dependencies
        run: deno install
      - name: Build
        shell: bash
        run: deno task build
      - name: Run tests
        shell: bash
        run: deno task test:deno
        env:
          FORCE_COLOR: "1"

  # Only need to update node matrix versions here.
  # Don't have to remember to update multiple jobs,just update this one.
  generate-node-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - name: Create versions variable
        id: matrix
        run: |
          echo 'versions=["10.x", "11.x", "12.x", "13.x", "14.x", "15.x", "16.x", "17.x", "18.x", "19.x", "20.x","21.x", "22.x", "23.x", "24.x", "25.x", "node"]' >> "$GITHUB_OUTPUT"

  generate-random-numbers-node:
    needs: [generate-node-matrix]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-matrix.outputs.versions) }}
    steps:
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Generate random numbers
        run: |
          node -e "
            const fs = require('fs');
            const sequence = Array.from({ length: 5 }, Math.random);
            const expected = Array.from({ length: 10 }, Math.random);
            const rands = { version: process.version, sequence, expected };
            const randsJson = JSON.stringify(rands);
            fs.writeFileSync('random-numbers.json', randsJson);
          "
      - name: Upload generated random numbers
        uses: actions/upload-artifact@v7
        with:
          name: random-numbers-${{ matrix.node-version }}
          path: random-numbers.json

  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Cache node_modules
        id: cache-node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node_modules.outputs.cache-hit != 'true'
        run: npm install --ignore-scripts
      - name: Build code
        run: npm run build:ci
      - name: Upload built dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: built-dist
          path: dist/

  test-node:
    needs: [build-node, generate-random-numbers-node, generate-node-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Download generated random numbers
        uses: actions/download-artifact@v8
        with:
          name: random-numbers-${{ matrix.node-version }}
          path: random-numbers/
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Run tests
        run: npm run test:node
        env:
          FORCE_COLOR: 1
          RANDOM_NUMBERS_FILE_PATH: ./random-numbers/random-numbers.json

  test-imports:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Run tests
        run: npm run test:imports
        env:
          FORCE_COLOR: "1"

  test-cli:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Get latest Deno version
        id: deno-version
        run: |
          version=$(curl -fsSL https://dl.deno.land/release-latest.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Deno ${{ steps.deno-version.outputs.version }}
        id: deno-cache
        uses: actions/cache@v6
        with:
          path: ~/.deno/bin
          key: deno-${{ runner.os }}-${{ runner.arch }}-${{ steps.deno-version.outputs.version }}
      - name: Install Deno ${{ steps.deno-version.outputs.version }}
        if: steps.deno-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
      - name: Add Deno to PATH
        run: echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Get latest Bun version
        id: bun-version
        run: |
          version=$(curl -fsSL https://api.github.com/repos/oven-sh/bun/releases/latest |
            jq -r '.tag_name' |
            sed 's/^bun-v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Bun ${{ steps.bun-version.outputs.version }}
        id: bun-cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/bin
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun-version.outputs.version }}
      - name: Install Bun ${{ steps.bun-version.outputs.version }}
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://bun.sh/install | bash
      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Run tests
        shell: bash
        run: npm run test:cli
        env:
          FORCE_COLOR: "1"

  test-chrome:
    needs: build-node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chrome-version:
          - "135" # The oldest Chrome version we support!
          - "136"
          - "140"
          - "145"
          - "stable" # Represents the most recent Chrome version.
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Cache Chrome binary
        id: chrome-cache
        uses: actions/cache@v6
        with:
          path: ./.browser-cache
          key: chrome-${{ runner.os }}-${{ runner.arch }}-${{ matrix.chrome-version }}
      - name: Download Chrome binary
        if: steps.chrome-cache.outputs.cache-hit != 'true'
        run: npm run browser:install
        env:
          BROWSER_TYPE: chrome
          VERSION_OR_TAG: ${{ matrix.chrome-version }}
          CACHE_DIRECTORY: ./.browser-cache
      - name: Run tests
        shell: bash
        run: npm run test:chrome
        env:
          FORCE_COLOR: "1"
          VERSION_OR_TAG: ${{ matrix.chrome-version }}
          CACHE_DIRECTORY: ./.browser-cache

  test-firefox:
    needs: build-node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firefox-version:
          - "stable_130.0" # The oldest Firefox version we support!
          - "stable_140.0"
          - "stable_150.0"
          - "stable" # Represents the most recent Firefox version.
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Cache Firefox binary
        id: firefox-cache
        uses: actions/cache@v6
        with:
          path: ./.browser-cache
          key: firefox-${{ runner.os }}-${{ runner.arch }}-${{ matrix.firefox-version }}
      - name: Download Firefox binary
        if: steps.firefox-cache.outputs.cache-hit != 'true'
        run: npm run browser:install
        env:
          BROWSER_TYPE: firefox
          VERSION_OR_TAG: ${{ matrix.firefox-version }}
          CACHE_DIRECTORY: ./.browser-cache
      - name: Run tests
        shell: bash
        run: npm run test:firefox
        env:
          FORCE_COLOR: "1"
          VERSION_OR_TAG: ${{ matrix.firefox-version }}
          CACHE_DIRECTORY: ./.browser-cache

  test-safari:
    needs: build-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: node
      - name: Download built dist artifact
        uses: actions/download-artifact@v8
        with:
          name: built-dist
          path: dist/
      - name: Restore node_modules cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Cache Playwright WebKit Binary
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: (Cache Miss) Install Playwright WebKit AND System Deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install webkit --with-deps
      - name: (Cache Hit) Install WebKit System Deps Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - name: Run tests
        shell: bash
        run: npm run test:safari
        env:
          FORCE_COLOR: "1"

  # This acts as the single required gatekeeper status check for repository ruleset
  check-node-success:
    needs: test-node
    runs-on: ubuntu-latest
    if: always() # Forces this job to run even if an upstream matrix item crashes
    steps:
      - name: Check matrix status results
        if: ${{ contains(needs.test-node.result, 'failure') || contains(needs.test-node.result, 'cancelled') }}
        run: |
          echo "One or more matrix versions failed to complete successfully."
          exit 1
      - name: All Matrix Nodes Passed Successfully
        if: ${{ !(contains(needs.test-node.result, 'failure') || contains(needs.test-node.result, 'cancelled')) }}
        run: |
          echo "All jobs in the matrix verified successfully!"
          exit 0

  # This acts as the single required gatekeeper status check for repository ruleset
  check-chrome-success:
    needs: test-chrome
    runs-on: ubuntu-latest
    if: always() # Forces this job to run even if an upstream matrix item crashes
    steps:
      - name: Check matrix status results
        if: ${{ contains(needs.test-chrome.result, 'failure') || contains(needs.test-chrome.result, 'cancelled') }}
        run: |
          echo "One or more matrix versions failed to complete successfully."
          exit 1
      - name: All Matrix Nodes Passed Successfully
        if: ${{ !(contains(needs.test-chrome.result, 'failure') || contains(needs.test-chrome.result, 'cancelled')) }}
        run: |
          echo "All jobs in the matrix completed successfully!"
          exit 0

  # This acts as the single required gatekeeper status check for repository ruleset
  check-firefox-success:
    needs: test-firefox
    runs-on: ubuntu-latest
    if: always() # Forces this job to run even if an upstream matrix item crashes
    steps:
      - name: Check matrix status results
        if: ${{ contains(needs.test-firefox.result, 'failure') || contains(needs.test-firefox.result, 'cancelled') }}
        run: |
          echo "One or more matrix versions failed to complete successfully."
          exit 1
      - name: All Matrix Nodes Passed Successfully
        if: ${{ !(contains(needs.test-firefox.result, 'failure') || contains(needs.test-firefox.result, 'cancelled')) }}
        run: |
          echo "All jobs in the matrix completed successfully!"
          exit 0
